
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOKA.PL 2.0 - FPS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center}
h1{color:#70ed70;font-size:42px}
button,input,select{padding:13px;border:0;border-radius:9px;margin:6px;font-size:16px}
button{background:#70ed70;font-weight:bold;cursor:pointer}
button:hover{background:#aaff99}
input{width:210px}
#menu{padding:25px 10px}
#game{display:none}
.panel{background:#20352a;padding:15px;margin:12px auto;border-radius:12px;max-width:450px}
#status{color:#aaffaa}
#screen{width:100%;height:100%;display:block}
#gameArea{position:relative;width:min(100%,950px);margin:auto;overflow:hidden}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px 3px black;font-weight:bold}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:27px;pointer-events:none}
#weapon{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:70px;pointer-events:none}
#message{position:absolute;bottom:90px;left:0;right:0;color:white;text-shadow:2px 2px 4px black}
#mobile{display:none;position:absolute;bottom:12px;left:10px;right:10px;justify-content:space-between}
#mobile button{opacity:.8}
@media(hover:none){#mobile{display:flex}}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>

<div id="menu">
<h1>NOKA.PL</h1>
<h2>BLOCK BATTLE 2.0</h2>
<p>FIRST PERSON SHOOTER</p>

<div class="panel">
<input id="playerName" maxlength="14" placeholder="Ditt namn">
</div>

<div class="panel">
<h3>VÄLJ SPELLÄGE</h3>
<button onclick="chooseMode('both')">FRIENDS + BOTS</button>
<button onclick="chooseMode('friends')">FRIENDS ONLY</button>
<button onclick="chooseMode('bots')">BOTS ONLY</button>
</div>

<div id="onlineOptions" class="panel" style="display:none">
<h3>MULTIPLAYER</h3>
<button onclick="createRoom()">CREATE ROOM</button>
<br>
<input id="roomCode" maxlength="6" placeholder="Rumskod">
<button onclick="joinRoom()">JOIN A FRIEND</button>
</div>

<div id="botOptions" class="panel" style="display:none">
<h3>BOTS</h3>
<select id="difficulty">
<option value="easy">Easy</option>
<option value="normal" selected>Normal</option>
<option value="hard">Hard</option>
</select>
<br>
<button onclick="startBots()">START GAME</button>
</div>

<div id="status">Ansluter till Firebase...</div>
<p class="small">NOKA.PL 2.0</p>
</div>

<div id="game">
<div id="gameArea">
<canvas id="screen" width="960" height="540"></canvas>

<div id="hud">
<span id="health">❤️ 100</span>
<span id="score">SCORE: 0</span>
<span id="roomLabel"></span>
</div>

<div id="crosshair">+</div>
<div id="weapon">🔫</div>
<div id="message">Klicka på spelet för att börja</div>

<div id="mobile">
<div>
<button ontouchstart="mobileKeys.w=true" ontouchend="mobileKeys.w=false">▲</button>
<br>
<button ontouchstart="mobileKeys.a=true" ontouchend="mobileKeys.a=false">◀</button>
<button ontouchstart="mobileKeys.s=true" ontouchend="mobileKeys.s=false">▼</button>
<button ontouchstart="mobileKeys.d=true" ontouchend="mobileKeys.d=false">▶</button>
</div>
<button onclick="shoot()">FIRE</button>
</div>
</div>

<p>WASD = MOVE | MOUSE = LOOK | CLICK = FIRE</p>
<button onclick="leaveGame()">LEAVE GAME</button>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {getAuth,signInAnonymously}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 getDatabase,ref,set,get,onValue,remove,onDisconnect
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyC8fWAd0PkCfC6h6dZ0CYQnWRv1w0Rhm90",
 authDomain:"randompl.firebaseapp.com",
 databaseURL:"https://randompl-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"randompl",
 storageBucket:"randompl.firebasestorage.app",
 messagingSenderId:"787540145240",
 appId:"1:787540145240:web:1358498a347fe6ce06862d",
 measurementId:"G-BJQ85GZMGZ"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");

let uid=null;
let room=null;
let mode="";
let running=false;
let name="Player";
let score=0;
let health=100;
let players={};
let bots=[];
let lastUpdate=0;
let lastShot=0;
let writeBusy=false;

const keys={};
const mobileKeys={w:false,a:false,s:false,d:false};

const player={
 x:4,y:4,angle:0
};

const map=[
 "111111111111",
 "100000000001",
 "101100010101",
 "100000000001",
 "100110100001",
 "100000000001",
 "101001010101",
 "100000000001",
 "100010000001",
 "111111111111"
];

const width=map[0].length;
const height=map.length;

function wall(x,y){
 const mx=Math.floor(x);
 const my=Math.floor(y);
 if(mx<0||my<0||mx>=width||my>=height)return true;
 return map[my][mx]==="1";
}

try{
 const result=await signInAnonymously(auth);
 uid=result.user.uid;
 document.getElementById("status").textContent=
 "Firebase ansluten!";
}catch(e){
 document.getElementById("status").textContent=
 "Firebase-fel: "+e.message;
}

window.chooseMode=function(m){
 mode=m;
 document.getElementById("onlineOptions").style.display=
 m==="bots"?"none":"block";
 document.getElementById("botOptions").style.display=
 m==="bots"?"block":"none";
 document.getElementById("status").textContent=
 m==="bots"?"Välj svårighetsgrad.":"Skapa ett rum eller gå med i ett rum.";
};

window.createRoom=async function(){
 if(!uid)return alert("Vänta på Firebase-inloggningen.");
 name=document.getElementById("playerName").value.trim()||"Player";
 room=Math.random().toString(36).substring(2,8).toUpperCase();
 await enterRoom();
};

window.joinRoom=async function(){
 if(!uid)return alert("Vänta på Firebase-inloggningen.");
 name=document.getElementById("playerName").value.trim()||"Player";
 room=document.getElementById("roomCode").value.trim().toUpperCase();
 if(!/^[A-Z0-9]{6}$/.test(room))return alert("Skriv en rumskod med 6 tecken.");
 try{
  const snap=await get(ref(db,"rooms/"+room));
  if(!snap.exists())return alert("Rummet finns inte.");
  await enterRoom();
 }catch(e){alert(e.message);}
};

async function enterRoom(){
 try{
  await startGame(mode==="both");
  const playerRef=ref(db,"rooms/"+room+"/players/"+uid);
  await set(playerRef,{
   x:player.x,y:player.y,angle:player.angle,name,
   color:"#70ed70"
  });
  await onDisconnect(playerRef).remove();

  onValue(ref(db,"rooms/"+room+"/players"),snap=>{
   players=snap.val()||{};
  });

  document.getElementById("roomLabel").textContent="ROOM: "+room;
  document.getElementById("status").textContent="Rumskod: "+room;
 }catch(e){
  alert("Kunde inte ansluta: "+e.message);
 }
}

window.startBots=async function(){
 name=document.getElementById("playerName").value.trim()||"Player";
 await startGame(true);
};

async function startGame(useBots){
 running=true;
 score=0;
 health=100;
 player.x=4;
 player.y=4;
 player.angle=0;
 players={};
 bots=[];
 if(useBots){
  const count=document.getElementById("difficulty").value==="easy"?3:
   document.getElementById("difficulty").value==="hard"?8:5;
  for(let i=0;i<count;i++){
   bots.push({
    x:2+Math.random()*7,
    y:2+Math.random()*6,
    angle:Math.random()*6.28,
    alive:true,
    color:["#ff6262","#64b5ff","#ffe66d"][i%3]
   });
  }
 }
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
 document.getElementById("message").textContent="Klicka för att låsa musen";
 requestAnimationFrame(loop);
}

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("click",()=>{
 if(!running)return;
 canvas.requestPointerLock?.();
 shoot();
});

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===canvas){
  player.angle+=e.movementX*0.003;
 }
});

window.shoot=function(){
 if(!running||Date.now()-lastShot<350)return;
 lastShot=Date.now();
 document.getElementById("weapon").textContent="✨";
 setTimeout(()=>{
  document.getElementById("weapon").textContent="🔫";
 },120);

 // Träffkontroll mot lokala bots
 for(const bot of bots){
  if(!bot.alive)continue;
  let dx=bot.x-player.x;
  let dy=bot.y-player.y;
  let distance=Math.hypot(dx,dy);
  let angle=Math.atan2(dy,dx)-player.angle;
  angle=Math.atan2(Math.sin(angle),Math.cos(angle));
  if(Math.abs(angle)<0.16 && distance<7){
   bot.alive=false;
   score+=100;
   document.getElementById("score").textContent="SCORE: "+score;
  }
 }
};

function update(){
 const speed=0.045;
 let dx=0,dy=0;
 if(keys.w||mobileKeys.w)dx+=Math.cos(player.angle)*speed,dy+=Math.sin(player.angle)*speed;
 if(keys.s||mobileKeys.s)dx-=Math.cos(player.angle)*speed,dy-=Math.sin(player.angle)*speed;
 if(keys.a||mobileKeys.a)dx+=Math.cos(player.angle-Math.PI/2)*speed,dy+=Math.sin(player.angle-Math.PI/2)*speed;
 if(keys.d||mobileKeys.d)dx+=Math.cos(player.angle+Math.PI/2)*speed,dy+=Math.sin(player.angle+Math.PI/2)*speed;

 if(!wall(player.x+dx,player.y))player.x+=dx;
 if(!wall(player.x,player.y+dy))player.y+=dy;

 for(const bot of bots){
  if(!bot.alive)continue;
  const angle=Math.atan2(player.y-bot.y,player.x-bot.x);
  bot.angle=angle;
  const distance=Math.hypot(player.x-bot.x,player.y-bot.y);
  if(distance>1.1){
   const bx=Math.cos(angle)*0.012;
   const by=Math.sin(angle)*0.012;
   if(!wall(bot.x+bx,bot.y))bot.x+=bx;
   if(!wall(bot.x,bot.y+by))bot.y+=by;
  }
  if(distance<1.2 && Math.random()<0.004){
   health=Math.max(0,health-5);
   document.getElementById("health").textContent="❤️ "+health;
  }
 }
 if(health<=0){
  running=false;
  document.getElementById("message").textContent="GAME OVER! SCORE: "+score;
  document.exitPointerLock?.();
 }
}

function castRay(angle){
 let distance=0;
 while(distance<20){
  distance+=0.025;
  const x=player.x+Math.cos(angle)*distance;
  const y=player.y+Math.sin(angle)*distance;
  if(wall(x,y))return distance;
 }
 return 20;
}

function render(){
 const w=canvas.width,h=canvas.height;
 const sky=ctx.createLinearGradient(0,0,0,h/2);
 sky.addColorStop(0,"#72b9e9");
 sky.addColorStop(1,"#b9e3f4");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,w,h/2);

 const ground=ctx.createLinearGradient(0,h/2,0,h);
 ground.addColorStop(0,"#667d54");
 ground.addColorStop(1,"#233b27");
 ctx.fillStyle=ground;
 ctx.fillRect(0,h/2,w,h/2);

 const zBuffer=[];
 for(let x=0;x<w;x++){
  const angle=player.angle+(x/w-0.5)*1.05;
  const distance=castRay(angle);
  zBuffer[x]=distance;
  const corrected=distance*Math.cos(angle-player.angle);
  const wallHeight=Math.min(h,h/corrected);
  const shade=Math.max(35,190-corrected*22);
  ctx.fillStyle=`rgb(${shade*.65},${shade},${shade*.65})`;
  ctx.fillRect(x,(h-wallHeight)/2,1,wallHeight);
 }

 // Rita bots och andra spelare som figurer i 3D-vyn
 const objects=[];

 for(const bot of bots){
  if(bot.alive)objects.push({
   x:bot.x,y:bot.y,color:bot.color,name:"BOT"
  });
 }

 for(const [id,p] of Object.entries(players)){
  if(id!==uid)objects.push({
   x:p.x,y:p.y,color:p.color||"#64b5ff",name:p.name||"FRIEND"
  });
 }

 objects.sort((a,b)=>
  Math.hypot(b.x-player.x,b.y-player.y)-
  Math.hypot(a.x-player.x,a.y-player.y)
 );

 for(const obj of objects){
  const dx=obj.x-player.x,dy=obj.y-player.y;
  const distance=Math.hypot(dx,dy);
  let angle=Math.atan2(dy,dx)-player.angle;
  angle=Math.atan2(Math.sin(angle),Math.cos(angle));
  if(Math.abs(angle)>0.7)continue;
  const screenX=w/2+Math.tan(angle)*w/1.05;
  const size=Math.min(350,h/distance*.65);
  const col=Math.max(0,Math.min(w-1,Math.floor(screenX)));
  if(distance>zBuffer[col]+0.2)continue;

  ctx.fillStyle=obj.color;
  ctx.fillRect(screenX-size/4,h/2-size/2,size/2,size);

  ctx.fillStyle="white";
  ctx.font="bold 14px Arial";
  ctx.textAlign="center";
  ctx.fillText(obj.name,screenX,h/2-size/2-8);
 }
}

async function syncPlayer(){
 if(!room||!uid||writeBusy||!running)return;
 writeBusy=true;
 try{
  await set(ref(db,"rooms/"+room+"/players/"+uid),{
   x:player.x,y:player.y,angle:player.angle,
   name,color:"#70ed70"
  });
 }catch(e){
  console.error(e);
 }finally{
  writeBusy=false;
 }
}

function loop(){
 if(!running)return;
 update();
 render();
 if(room&&Date.now()-lastUpdate>200){
  lastUpdate=Date.now();
  syncPlayer();
 }
 requestAnimationFrame(loop);
}

window.leaveGame=async function(){
 running=false;
 document.exitPointerLock?.();
 if(room&&uid){
  try{
   await remove(ref(db,"rooms/"+room+"/players/"+uid));
  }catch(e){console.error(e);}
 }
 room=null;
 document.getElementById("game").style.display="none";
 document.getElementById("menu").style.display="block";
 document.getElementById("status").textContent="Tillbaka i menyn.";
};

</script>
</body>
</html>
