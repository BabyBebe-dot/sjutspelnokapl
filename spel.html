
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noka – Blockspel</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #18251a;
  color: white;
  font-family: monospace;
  text-align: center;
}
h1 { color: #8cff70; }
#info {
  display: flex;
  justify-content: center;
  gap: 25px;
  font-size: 18px;
  margin: 10px;
}
canvas {
  background: #8fd3ff;
  border: 5px solid white;
  width: min(95vw, 900px);
  height: auto;
  image-rendering: pixelated;
}
button {
  padding: 12px 22px;
  margin: 8px;
  font-size: 18px;
  font-weight: bold;
  border: 3px solid white;
  background: #8cff70;
  cursor: pointer;
}
#controls { margin: 10px; }
</style>
</head>
<body>

<h1>🟩 NOKA – BLOCKSPEL</h1>

<div id="info">
  <span>Poäng: <b id="score">0</b></span>
  <span>Mynt: <b id="coins">0</b></span>
</div>

<canvas id="game" width="900" height="500"></canvas>

<div>
  <button onclick="startGame()">▶ STARTA SPELET</button>
</div>

<div id="controls">
  <p>W A S D = Gå | Mellanslag = Hoppa</p>
  <p>Samla mynt och undvik de röda blocken!</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, enemies, coins, score, coinCount;
let keys = {};
let running = false;
let gameOver = false;
let camera = 0;
let frame = 0;

function resetGame() {
  player = {
    x: 80, y: 350, w: 30, h: 40,
    vx: 0, vy: 0, onGround: false
  };

  enemies = [
    {x: 450, y: 410, w: 35, h: 35, vx: 2},
    {x: 750, y: 410, w: 35, h: 35, vx: 2.5},
    {x: 1100, y: 410, w: 35, h: 35, vx: 3}
  ];

  coins = [];
  for (let i = 0; i < 18; i++) {
    coins.push({
      x: 250 + i * 100,
      y: 300 - (i % 3) * 65,
      taken: false
    });
  }

  score = 0;
  coinCount = 0;
  camera = 0;
  frame = 0;
  gameOver = false;
}

function startGame() {
  resetGame();
  running = true;
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === "Space") {
    keys.space = true;
    e.preventDefault();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
  if (e.code === "Space") keys.space = false;
});

function drawBlock(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x - camera, y, w, h);
  ctx.strokeStyle = "#172317";
  ctx.lineWidth = 3;
  ctx.strokeRect(x - camera, y, w, h);
}

function update() {
  frame++;

  if (keys.a || keys.arrowleft) player.vx = -4;
  else if (keys.d || keys.arrowright) player.vx = 4;
  else player.vx *= 0.8;

  if ((keys.space || keys.w || keys.arrowup) && player.onGround) {
    player.vy = -12;
    player.onGround = false;
  }

  player.x += player.vx;
  player.y += player.vy;
  player.vy += 0.55;

  if (player.y + player.h >= 450) {
    player.y = 450 - player.h;
    player.vy = 0;
    player.onGround = true;
  }

  if (player.x < 0) player.x = 0;

  camera = Math.max(0, player.x - 250);

  enemies.forEach(enemy => {
    enemy.x += enemy.vx;
    if (enemy.x < 350 || enemy.x > 1500) {
      enemy.vx *= -1;
    }

    if (
      player.x < enemy.x + enemy.w &&
      player.x + player.w > enemy.x &&
      player.y < enemy.y + enemy.h &&
      player.y + player.h > enemy.y
    ) {
      running = false;
      gameOver = true;
    }
  });

  coins.forEach(coin => {
    if (!coin.taken &&
      player.x < coin.x + 20 &&
      player.x + player.w > coin.x &&
      player.y < coin.y + 20 &&
      player.y + player.h > coin.y) {
      coin.taken = true;
      coinCount++;
      score += 10;
    }
  });

  score += 1;
  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = coinCount;

  if (player.x > 1800) {
    running = false;
    gameOver = true;
  }
}

function draw() {
  ctx.clearRect(0, 0, 900, 500);

  // Himmel
  ctx.fillStyle = "#8fd3ff";
  ctx.fillRect(0, 0, 900, 500);

  // Moln
  ctx.fillStyle = "white";
  for (let i = 0; i < 8; i++) {
    let x = ((i * 170 - camera * 0.3) % 1100 + 1100) % 1100;
    ctx.fillRect(x, 70 + (i % 3) * 35, 65, 20);
    ctx.fillRect(x + 15, 55 + (i % 3) * 35, 35, 20);
  }

  // Mark
  ctx.fillStyle = "#399c39";
  ctx.fillRect(0, 450, 900, 50);

  ctx.fillStyle = "#80502e";
  ctx.fillRect(0, 475, 900, 25);

  // Plattformar
  for (let i = 0; i < 10; i++) {
    drawBlock(i * 220, 420, 50, 30, "#986536");
  }

  // Mynt
  coins.forEach(coin => {
    if (!coin.taken) {
      ctx.fillStyle = "#ffd52e";
      ctx.beginPath();
      ctx.arc(coin.x - camera + 10, coin.y + 10, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#a87500";
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  });

  // Fiender
  enemies.forEach(enemy => {
    drawBlock(enemy.x, enemy.y, enemy.w, enemy.h, "#e43d3d");
    ctx.fillStyle = "white";
    ctx.fillRect(enemy.x - camera + 7, enemy.y + 8, 6, 6);
    ctx.fillRect(enemy.x - camera + 22, enemy.y + 8, 6, 6);
  });

  // Spelare
  drawBlock(player.x, player.y, player.w, player.h, "#2864db");
  ctx.fillStyle = "#f2c090";
  ctx.fillRect(player.x - camera + 5, player.y + 3, 20, 13);
  ctx.fillStyle = "#172317";
  ctx.fillRect(player.x - camera + 10, player.y + 8, 4, 4);
  ctx.fillRect(player.x - camera + 20, player.y + 8, 4, 4);

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, 900, 500);
    ctx.fillStyle = "white";
    ctx.font = "bold 48px monospace";
    ctx.textAlign = "center";
    ctx.fillText(
      player.x > 1800 ? "DU VANN!" : "GAME OVER",
      450, 220
    );
    ctx.font = "22px monospace";
    ctx.fillText("Tryck på STARTA SPELET igen", 450, 275);
  }
}

function loop() {
  if (!running) return;
  update();
  draw();
  if (running) requestAnimationFrame(loop);
}

resetGame();
draw();
</script>
</body>
</html>
