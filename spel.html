<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noka Multiplayer</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}
#menu{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#101820,#253b22);
}
.card{
  width:360px;
  max-width:90%;
  padding:30px;
  background:#fff;
  border-radius:18px;
  text-align:center;
  box-shadow:0 15px 50px #0008;
}
h1{
  margin-top:0;
  font-size:42px;
}
button,input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-size:16px;
}
button{
  background:#222;
  color:white;
  cursor:pointer;
}
button:hover{
  background:#444;
}
input{
  border:2px solid #ddd;
}
#status{
  min-height:22px;
  margin-top:12px;
  color:#c00;
}
#game{
  display:none;
  width:100vw;
  height:100vh;
}
#hud{
  position:fixed;
  z-index:5;
  top:15px;
  left:15px;
  color:white;
  background:#0009;
  padding:12px 15px;
  border-radius:12px;
}
#room{
  font-weight:bold;
}
#players{
  margin-top:5px;
}
#crosshair{
  position:fixed;
  z-index:6;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
}
#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
}
#crosshair:before{
  width:18px;
  height:2px;
  top:8px;
}
#crosshair:after{
  width:2px;
  height:18px;
  left:8px;
}
#info{
  position:fixed;
  z-index:6;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:#0009;
  padding:9px 14px;
  border-radius:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div id="menu">
  <div class="card">
    <h1>🎮 NOKA</h1>

    <input id="roomInput"
           maxlength="6"
           placeholder="Skriv rumskod">

    <button id="createBtn">
      SKAPA RUM
    </button>

    <button id="joinBtn">
      GÅ MED I RUM
    </button>

    <div id="status"></div>
  </div>
</div>

<div id="game">
  <div id="hud">
    🎮 NOKA<br>
    Rum: <span id="room">---</span><br>
    <span id="players">Spelare: 1</span>
  </div>

  <div id="crosshair"></div>

  <div id="info">
    WASD = gå &nbsp; | &nbsp;
    Mus = titta &nbsp; | &nbsp;
    ESC = meny
  </div>
</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  update,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyC0fW1AdOPkCf6n6dZ0CYQnWrV1wRmh990",
  authDomain: "randompl.firebaseapp.com",
  databaseURL: "https://randompl-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "randompl",
  storageBucket: "randompl.firebasestorage.app",
  messagingSenderId: "787540145240",
  appId: "1:787540145240:web:13584e8347fe6ce06862d",
  measurementId: "G-BJQ85GZMGZ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);


/* =========================
   ELEMENT
========================= */

const menu = document.getElementById("menu");
const game = document.getElementById("game");
const roomInput = document.getElementById("roomInput");
const createBtn = document.getElementById("createBtn");
const joinBtn = document.getElementById("joinBtn");
const statusText = document.getElementById("status");
const roomText = document.getElementById("room");
const playersText = document.getElementById("players");


/* =========================
   PLAYER
========================= */

let user = null;
let roomId = null;

let player = {
  x: 0,
  z: 0
};

const players = {};

const keys = {};


/* =========================
   AUTH
========================= */

signInAnonymously(auth)
  .catch(error => {
    console.error(error);
    statusText.textContent =
      "Firebase-inloggningen misslyckades.";
  });

onAuthStateChanged(auth, u => {
  if (u) {
    user = u;
    console.log("Spelare ansluten:", user.uid);
  }
});


/* =========================
   ROOM CODE
========================= */

function makeRoomCode(){

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for(let i=0;i<6;i++){
    code += chars[Math.floor(Math.random()*chars.length)];
  }

  return code;
}


/* =========================
   CREATE ROOM
========================= */

createBtn.onclick = async () => {

  if(!user){
    statusText.textContent =
      "Vänta lite på Firebase...";
    return;
  }

  const code = makeRoomCode();

  roomId = code;

  player.x = 0;
  player.z = 0;

  await set(
    ref(db, "rooms/" + roomId + "/players/" + user.uid),
    {
      x: player.x,
      z: player.z
    }
  );

  startGame();

  listenToPlayers();

};


/* =========================
   JOIN ROOM
========================= */

joinBtn.onclick = async () => {

  if(!user){
    statusText.textContent =
      "Vänta lite på Firebase...";
    return;
  }

  const code =
    roomInput.value.trim().toUpperCase();

  if(code.length !== 6){
    statusText.textContent =
      "Skriv en rumskod på 6 tecken.";
    return;
  }

  roomId = code;

  player.x = 0;
  player.z = 0;

  try{

    await set(
      ref(db, "rooms/" + roomId + "/players/" + user.uid),
      {
        x: player.x,
        z: player.z
      }
    );

    startGame();

    listenToPlayers();

  }catch(error){

    console.error(error);

    statusText.textContent =
      "Kunde inte gå med i rummet.";

  }

};


/* =========================
   START
========================= */

function startGame(){

  menu.style.display = "none";
  game.style.display = "block";

  roomText.textContent = roomId;

  createWorld();

  window.requestAnimationFrame(loop);

}


/* =========================
   3D-LIKNANDE VÄRLD
========================= */

function createWorld(){

  game.innerHTML += `
    <div id="world"></div>
  `;

  const world =
    document.getElementById("world");

  world.style.position = "absolute";
  world.style.inset = "0";
  world.style.background = `
    linear-gradient(#77b5e8 0 48%, #4b8c3c 48% 100%)
  `;

  for(let i=0;i<35;i++){

    const block =
      document.createElement("div");

    block.style.position = "absolute";
    block.style.width =
      (40 + Math.random()*70) + "px";

    block.style.height =
      (40 + Math.random()*70) + "px";

    block.style.left =
      Math.random()*95 + "%";

    block.style.top =
      (50 + Math.random()*40) + "%";

    block.style.background =
      "#6b4f32";

    block.style.border =
      "4px solid #3d2e20";

    block.style.boxShadow =
      "inset 0 10px #79b84b";

    world.appendChild(block);
  }

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", e => {

  keys[e.key.toLowerCase()] = true;

});

document.addEventListener("keyup", e => {

  keys[e.key.toLowerCase()] = false;

});


/* =========================
   MOVEMENT
========================= */

function move(){

  const speed = 4;

  if(keys["w"])
    player.z -= speed;

  if(keys["s"])
    player.z += speed;

  if(keys["a"])
    player.x -= speed;

  if(keys["d"])
    player.x += speed;

}


/* =========================
   SEND POSITION
========================= */

async function sendPosition(){

  if(!user || !roomId)
    return;

  await update(
    ref(
      db,
      "rooms/" +
      roomId +
      "/players/" +
      user.uid
    ),
    {
      x: player.x,
      z: player.z
    }
  );

}


/* =========================
   OTHER PLAYERS
========================= */

function listenToPlayers(){

  const roomRef =
    ref(db, "rooms/" + roomId + "/players");

  onValue(roomRef, snapshot => {

    const data = snapshot.val() || {};

    const count =
      Object.keys(data).length;

    playersText.textContent =
      "Spelare: " + count;

    for(const id in data){

      if(id === user.uid)
        continue;

      players[id] = data[id];

    }

  });

}


/* =========================
   GAME LOOP
========================= */

let lastSend = 0;

function loop(time){

  move();

  /*
   Skicka spelarens position
   ungefär 10 gånger per sekund.
  */

  if(time - lastSend > 100){

    sendPosition();

    lastSend = time;

  }

  render();

  requestAnimationFrame(loop);

}


/* =========================
   RENDER
========================= */

function render(){

  /*
   Enkel blockig multiplayer-visning.
  */

  let world =
    document.getElementById("world");

  if(!world)
    return;

  /*
   Ta bort gamla spelare.
  */

  document
    .querySelectorAll(".otherPlayer")
    .forEach(el => el.remove());


  for(const id in players){

    const p = players[id];

    const el =
      document.createElement("div");

    el.className =
      "otherPlayer";

    el.style.position =
      "absolute";

    el.style.width =
      "28px";

    el.style.height =
      "45px";

    el.style.background =
      "#d44";

    el.style.border =
      "4px solid #222";

    /*
     Gör en enkel kameraeffekt.
    */

    const screenX =
      50 + (p.x - player.x) * 0.15;

    const screenY =
      55 + (p.z - player.z) * 0.08;

    el.style.left =
      screenX + "%";

    el.style.top =
      screenY + "%";

    world.appendChild(el);

  }

}


/* =========================
   DISCONNECT
========================= */

window.addEventListener("beforeunload", () => {

  if(user && roomId){

    set(
      ref(
        db,
        "rooms/" +
        roomId +
        "/players/" +
        user.uid
      ),
      null
    );

  }

});

</script>

</body>
</html>
